name: Personix Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main-android]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: personix-android-${{ github.ref }}
  cancel-in-progress: false

env:
  MIN_SDK_VERSION: 24
  TARGET_SDK_VERSION: 36
  RELEASE_BASENAME: personix

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies using package-lock
        run: npm install

      - name: Lint
        run: npm run lint

      # - name: Unit tests
      #   run: npm test -- --watch=false

      - name: Auto-increment Android versionCode
        if: github.ref == 'refs/heads/main-android'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/bump-android-version.js
          VERSION_CODE=$(node -p "require('./android-version.json').versionCode")
          git add android-version.json
          git diff --cached --quiet || git commit -m "chore: bump Android versionCode to $VERSION_CODE [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Build Angular application
        run: npm run build -- --configuration=production

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Apply Android version and SDK levels
        working-directory: android/app
        run: |
          VERSION_CODE=$(node -p "require('../../android-version.json').versionCode")
          VERSION_NAME=$(node -p "require('../../android-version.json').versionName")
          sed -i 's/versionCode [0-9]*/versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1/' build.gradle
          sed -i 's/versionName "[^"]*"/versionName project.hasProperty("versionName") ? project.versionName : "1.0.0"/' build.gradle
          sed -i "s/minSdkVersion = .*/minSdkVersion = $MIN_SDK_VERSION/" ../variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = $TARGET_SDK_VERSION/" ../variables.gradle
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=${RELEASE_BASENAME}-${VERSION_NAME//./-}" >> "$GITHUB_ENV"

      - name: Generate branded launcher and Play Store icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          declare -A SIZES=([mipmap-mdpi]=48 [mipmap-hdpi]=72 [mipmap-xhdpi]=96 [mipmap-xxhdpi]=144 [mipmap-xxxhdpi]=192)
          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            ICON_SIZE=$((SIZE * 64 / 100))
            mkdir -p "android/app/src/main/res/$DIR"
            convert public/personix.png -background none -resize "${ICON_SIZE}x${ICON_SIZE}" -gravity center -extent "${SIZE}x${SIZE}" "android/app/src/main/res/$DIR/ic_launcher.png"
            cp "android/app/src/main/res/$DIR/ic_launcher.png" "android/app/src/main/res/$DIR/ic_launcher_round.png"
            cp "android/app/src/main/res/$DIR/ic_launcher.png" "android/app/src/main/res/$DIR/ic_launcher_foreground.png"
          done
          mkdir -p releases
          convert public/personix.png -background none -resize 420x420 -gravity center -extent 512x512 releases/playstore-icon.png

      - name: Build debug APK for normal branches
        if: github.ref != 'refs/heads/main-android' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: |
          ./gradlew assembleDebug -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "../releases/${RELEASE_FILE}-debug.apk"

      - name: Build optimized release APK and AAB
        if: github.ref == 'refs/heads/main-android' || startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Preserve R8 mapping
        if: github.ref == 'refs/heads/main-android' || startsWith(github.ref, 'refs/tags/v')
        run: |
          test -s android/app/build/outputs/mapping/release/mapping.txt
          cp android/app/build/outputs/mapping/release/mapping.txt "releases/${RELEASE_FILE}-mapping.txt"

      - name: Decode signing keystore
        id: keystore
        if: github.ref == 'refs/heads/main-android' || startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]] && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            rm -f android/app/release-keystore.jks
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect keystore type
        id: keystore_type
        if: steps.keystore.outputs.available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KS_TYPE=$(keytool -list -keystore android/app/release-keystore.jks -storepass:env KEYSTORE_PASSWORD 2>/dev/null | grep -i "Keystore type" | awk '{print $NF}')
          echo "type=$KS_TYPE" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        id: sign_apk
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ steps.keystore_type.outputs.type == 'PKCS12' && secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(find android/app/build -name '*-release-unsigned.apk' | head -1)
          "$BUILD_TOOLS/zipalign" -v 4 "$UNSIGNED" "releases/${RELEASE_FILE}.apk"
          "$BUILD_TOOLS/apksigner" sign --ks android/app/release-keystore.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD "releases/${RELEASE_FILE}.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "releases/${RELEASE_FILE}.apk"

      - name: Copy unsigned APK
        if: (github.ref == 'refs/heads/main-android' || startsWith(github.ref, 'refs/tags/v')) && (steps.keystore.outputs.available != 'true' || steps.sign_apk.outcome == 'failure')
        run: cp "$(find android/app/build -name '*-release-unsigned.apk' | head -1)" "releases/${RELEASE_FILE}-unsigned.apk"

      - name: Sign AAB
        id: sign_aab
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ steps.keystore_type.outputs.type == 'PKCS12' && secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED=$(find android/app/build -name '*-release.aab' | head -1)
          printf '%s' "$KEYSTORE_PASSWORD" > /tmp/personix-store-pass
          printf '%s' "$KEY_PASSWORD" > /tmp/personix-key-pass
          jarsigner -keystore android/app/release-keystore.jks -storepass:file /tmp/personix-store-pass -keypass:file /tmp/personix-key-pass -signedjar "releases/${RELEASE_FILE}.aab" "$UNSIGNED" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "releases/${RELEASE_FILE}.aab"
          rm -f /tmp/personix-store-pass /tmp/personix-key-pass

      - name: Copy unsigned AAB
        if: (github.ref == 'refs/heads/main-android' || startsWith(github.ref, 'refs/tags/v')) && (steps.keystore.outputs.available != 'true' || steps.sign_aab.outcome == 'failure')
        run: cp "$(find android/app/build -name '*-release.aab' | head -1)" "releases/${RELEASE_FILE}-unsigned.aab"

      - name: Verify release artifacts
        run: |
          test -n "$(find releases -maxdepth 1 -name '*.apk' -type f -print -quit)"
          if [[ "$GITHUB_REF" == "refs/heads/main-android" || "$GITHUB_REF" == refs/tags/v* ]]; then
            test -n "$(find releases -maxdepth 1 -name '*.aab' -type f -print -quit)"
            test -s "releases/${RELEASE_FILE}-mapping.txt"
          fi
          find releases -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Commit release files to main-android
        if: github.ref == 'refs/heads/main-android'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add releases/
          if git diff --cached --quiet; then
            echo "Release files are unchanged."
          else
            git commit -m "build: update Personix Android release files [skip ci]"
            git push
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: personix-android-${{ env.VERSION_NAME }}
          path: |
            releases/*.apk
            releases/*.aab
            releases/*-mapping.txt
            releases/playstore-icon.png
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/*.apk
            releases/*.aab
            releases/*-mapping.txt
            releases/playstore-icon.png

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release-keystore.jks /tmp/personix-store-pass /tmp/personix-key-pass
